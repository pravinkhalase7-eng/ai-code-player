# Host nginx for TECHSHALA / ai-code-player
# Install: sudo cp deploy/play.doxstation.com.conf /etc/nginx/sites-available/play.doxstation.com
#          sudo ln -sf /etc/nginx/sites-available/play.doxstation.com /etc/nginx/sites-enabled/
# Then:    sudo certbot --nginx -d play.doxstation.com
#
# Upstream is the Jenkins-published Next UI. Next already rewrites
# /api /audio /images to the API container (API_ORIGIN).

upstream aicoder_web {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.doxstation.com;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://aicoder_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
