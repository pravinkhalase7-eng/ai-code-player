services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: aicoder
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d aicoder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  code-runner:
    build:
      context: ./services/code-runner
    ports:
      - "${RUNNER_HOST_PORT:-8090}:8090"
    environment:
      CODE_EXECUTION_TIMEOUT: ${CODE_EXECUTION_TIMEOUT:-5}
      CODE_EXECUTION_MEMORY_MB: ${CODE_EXECUTION_MEMORY_MB:-256}
      CODE_EXECUTION_OUTPUT_LIMIT: ${CODE_EXECUTION_OUTPUT_LIMIT:-65536}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tutor:tutor@postgres:5432/aicoder
      REDIS_URL: redis://redis:6379/0
      KOKORO_URL: http://kokoro:8880
      CODE_RUNNER_URL: http://code-runner:8090
      STORAGE_PATH: /data
      USE_CELERY: "true"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - storage_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tutor:tutor@postgres:5432/aicoder
      REDIS_URL: redis://redis:6379/0
      KOKORO_URL: http://kokoro:8880
      CODE_RUNNER_URL: http://code-runner:8090
      STORAGE_PATH: /data
      USE_CELERY: "true"
    volumes:
      - storage_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      API_ORIGIN: http://backend:8000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

  remotion-renderer:
    profiles: ["render"]
    build:
      context: ./frontend
    command: npx remotion studio remotion/index.ts --port 3100
    ports:
      - "3100:3100"
    environment:
      API_ORIGIN: http://backend:8000

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    profiles: ["proxy"]

volumes:
  postgres_data:
  storage_data:
